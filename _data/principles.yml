- title: "Persona-specific"
  text: "Define the role, tone, and expertise you want. A study partner, a writing editor, a cooking guide, whatever you need."

- title: "Customizable"
  text: "You decide how it behaves. Settings are explicit and adjustable, not buried."

- title: "General purpose"
  text: "Not limited to a single domain. Ask it to plan, explain, draft, or think something through."

- title: "Privacy-minded"
  text: "We collect what is needed to run the service and explain it plainly in our Privacy Policy."
